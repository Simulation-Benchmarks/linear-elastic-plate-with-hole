name: EdelweissFE CI
on:
  push:

  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to checkout for the benchmark run
        required: false
        type: string
      benchmark_file:
        description: Path to the semantic benchmark JSON-LD file
        required: false
        type: string
      benchmark_artifact_name:
        description: Optional artifact containing the benchmark files
        required: false
        type: string
        default: ''

env:
  BENCHMARK_NAME: linear-elastic-plate-with-hole
  EXAMPLE_BENCHMARK_FILE: ${{ inputs.benchmark_file || 'benchmark/1.1.0/minimal-configurations.json' }}
  SOFTWARE_NAME: edelweissFE
  CONDA_ENV: edelweissfe-model-validation

jobs:
  run-examples:
    name: EdelweissFE
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v4
        with:
            miniforge-version: latest
            use-mamba: true
            conda-remove-defaults: "true"

      - name: Create ${{ env.SOFTWARE_NAME }} environment
        run: mamba env create -n "${CONDA_ENV}" -f "${SOFTWARE_NAME}/environment_benchmark.yml"

      - name: Install provenance Python packages
        shell: bash -l {0}
        run: |
          python -m pip install -r requirements.txt

      - name: Download benchmark resources artifact
        if: inputs.benchmark_artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.benchmark_artifact_name }}
          path: downloaded-benchmark

      - name: Verify local benchmark resources
        shell: bash -l {0}
        run: |
          test -f "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}"

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Run ${{ env.BENCHMARK_NAME }} using ${{ env.SOFTWARE_NAME }}
        shell: bash -l {0}
        run: |
          cd "$GITHUB_WORKSPACE/${SOFTWARE_NAME}/"
          conda run -n "${CONDA_ENV}" python run_benchmark.py \
            --benchmark-file "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}" \
            --rocrate-name "${RUNNER_TEMP}/${SOFTWARE_NAME}_rocrate.zip" \
            --result-path "${GITHUB_WORKSPACE}/${SOFTWARE_NAME}/results" \
            --main-rocrate-profile "${GITHUB_WORKSPACE}/provenance/profiles/main-rocrate-${SOFTWARE_NAME}.yml" \
            --reporter-rocrate-profile "${GITHUB_WORKSPACE}/provenance/profiles/reporter-rocrate.yml" \
            --workflow-path "${GITHUB_WORKSPACE}/.github/workflows/run-benchmark-edelweissfe.yml"

      - name: Archive results of the ${{ env.SOFTWARE_NAME }} run of ${{ env.BENCHMARK_NAME }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}_results_${{ env.BENCHMARK_NAME }}
          path: |
            ${{ env.SOFTWARE_NAME }}/results/
            !${{ env.SOFTWARE_NAME }}/results/*/workflow-run.zip

      - name: Archive ${{ env.SOFTWARE_NAME }} main RO-Crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}-main-rocrate
          path: ${{ runner.temp }}/${{ env.SOFTWARE_NAME }}_rocrate.zip