name: RoHub Upload CI

on:
  schedule:
    - cron: '0 17 * * 5'
    
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run and publish
        required: true
        default: main
      use_production_rohub:
        description: Upload to production RoHub
        required: true
        type: boolean
        default: true
      fenics_tool_version:
        description: FEniCS version used for this run
        required: false
        type: string
      kratos_tool_version:
        description: Kratos version used for this run
        required: false
        type: string
      extendablefem_tool_version:
        description: ExtendableFEM version used for this run
        required: false
        type: string
      edelweissfe_tool_version:
        description: EdelweissFE version used for this run
        required: false
        type: string

permissions:
  contents: read

env:
  BENCHMARK_ROHUB_IDENTIFIER: 68b027dd-666b-4b32-a416-952960022c2c
  USE_PRODUCTION_ROHUB: ${{ inputs.use_production_rohub }}

jobs:
  prepare-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install semantic-benchmark
        run: python -m pip install "semantic-benchmark<=0.3.2"

      - name: Select RoHub credentials
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Download benchmark RO-Crate and JSON-LD from RoHub
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/downloaded-benchmark"
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          download-semantic-benchmark \
            --identifier "${BENCHMARK_ROHUB_IDENTIFIER}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --path "${GITHUB_WORKSPACE}/downloaded-benchmark" \
            --semantic-resource-filename "${GITHUB_WORKSPACE}/downloaded-benchmark/benchmark.json" \
            "${rohub_args[@]}"

      - name: Archive downloaded benchmark resources
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-benchmark-resources
          path: downloaded-benchmark/

  run-fenics:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-fenics.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      tool_version: ${{ inputs.fenics_tool_version || '0.9.0' }}

  run-kratos:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-kratos.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      tool_version: ${{ inputs.kratos_tool_version || '10.3.0' }}

  run-extendablefem:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-extendablefem.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      tool_version: ${{ inputs.extendablefem_tool_version || '1.12.0' }}

  run-edelweissFE:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-edelweissfe.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      tool_version: ${{ inputs.edelweissfe_tool_version || '26.03' }}

  upload-fenics:
    needs: run-fenics
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      tool: fenics
      display_name: Fenics
      used_software_url: https://zbmath.org/software/4314
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
    secrets: inherit

  upload-kratos:
    needs: run-kratos
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      tool: kratos
      display_name: Kratos
      used_software_url: https://zbmath.org/software/7804
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
    secrets: inherit

  upload-extendablefem:
    needs: run-extendablefem
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      tool: extendablefem
      display_name: ExtendableFEM
      used_software_url: https://zbmath.org/software/53664
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
    secrets: inherit

  upload-edelweissFE:
    needs: run-edelweissFE
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      tool: edelweissFE
      display_name: EdelweissFE
      used_software_url: https://zenodo.org/records/20496210
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
    secrets: inherit
