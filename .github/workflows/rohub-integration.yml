name: RoHub Upload CI

on:
  schedule:
    - cron: '0 17 * * 5'
    
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run and publish
        required: true
        default: main
      download_from_rohub:
        description: Download benchmark resources from RoHub instead of using local files
        required: true
        type: boolean
        default: false
      use_production_rohub:
        description: Upload to production RoHub
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  BENCHMARK_ROHUB_IDENTIFIER: &benchmark_rohub_identifier 68b027dd-666b-4b32-a416-952960022c2c
  USE_PRODUCTION_ROHUB: ${{ inputs.use_production_rohub }}

jobs:
  prepare-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        if: inputs.download_from_rohub
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install semantic-benchmark
        if: inputs.download_from_rohub
        run: python -m pip install -r requirements.txt

      - name: Select RoHub credentials
        if: inputs.download_from_rohub
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Download benchmark RO-Crate and JSON-LD from RoHub
        if: inputs.download_from_rohub
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/downloaded-benchmark"
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          download-semantic-benchmark \
            --identifier "${BENCHMARK_ROHUB_IDENTIFIER}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --path "${GITHUB_WORKSPACE}/downloaded-benchmark" \
            --semantic-resource-filename "${GITHUB_WORKSPACE}/downloaded-benchmark/benchmark.json" \
            "${rohub_args[@]}"

      - name: Archive downloaded benchmark resources
        if: inputs.download_from_rohub
        uses: actions/upload-artifact@v7
        with:
          name: downloaded-benchmark-resources
          path: downloaded-benchmark/

  run-fenics:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-fenics.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: ${{ inputs.download_from_rohub && 'downloaded-benchmark/benchmark.json' || 'benchmark/1.0.0/minimal-configurations.json' }}
      benchmark_artifact_name: ${{ inputs.download_from_rohub && 'downloaded-benchmark-resources' || '' }}

  run-kratos:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-kratos.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: ${{ inputs.download_from_rohub && 'downloaded-benchmark/benchmark.json' || 'benchmark/1.0.0/minimal-configurations.json' }}
      benchmark_artifact_name: ${{ inputs.download_from_rohub && 'downloaded-benchmark-resources' || '' }}

  run-extendablefem:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-extendablefem.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: ${{ inputs.download_from_rohub && 'downloaded-benchmark/benchmark.json' || 'benchmark/1.0.0/minimal-configurations.json' }}
      benchmark_artifact_name: ${{ inputs.download_from_rohub && 'downloaded-benchmark-resources' || '' }}

  run-edelweissFE:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-edelweissfe.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: ${{ inputs.download_from_rohub && 'downloaded-benchmark/benchmark.json' || 'benchmark/1.0.0/minimal-configurations.json' }}
      benchmark_artifact_name: ${{ inputs.download_from_rohub && 'downloaded-benchmark-resources' || '' }}

  upload-fenics:
    needs: run-fenics
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      software: fenics
      display_name: FEniCS
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
      benchmark_rohub_identifier: *benchmark_rohub_identifier
    secrets: inherit

  upload-kratos:
    needs: run-kratos
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      software: kratos
      display_name: KRATOS
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
      benchmark_rohub_identifier: *benchmark_rohub_identifier
    secrets: inherit

  upload-extendablefem:
    needs: run-extendablefem
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      software: extendablefem
      display_name: ExtendableFEM.jl
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
      benchmark_rohub_identifier: *benchmark_rohub_identifier
    secrets: inherit

  upload-edelweissFE:
    needs: run-edelweissFE
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      software: edelweissFE
      display_name: EdelweissFE
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
      benchmark_rohub_identifier: *benchmark_rohub_identifier
    secrets: inherit
