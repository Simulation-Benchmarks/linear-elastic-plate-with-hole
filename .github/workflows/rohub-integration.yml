name: RoHub Upload CI

on:
  schedule:
    - cron: '0 17 * * 5'
    
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run and publish
        required: true
        default: main
      use_production_rohub:
        description: Upload to production RoHub
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  BENCHMARK_NAME: linear-elastic-plate-with-hole
  BENCHMARK_ROHUB_IDENTIFIER: 68b027dd-666b-4b32-a416-952960022c2c
  BENCHMARK_VERSION: 1.0.0
  BENCHMARK_ARTIFACT_NAME: downloaded-benchmark-resources
  BENCHMARK_FILE: downloaded-benchmark/benchmark.json
  BENCHMARK_ZIP: downloaded-benchmark/linear-elastic-plate-with-hole.zip
  BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
  CODE_REPOSITORY_URL: https://github.com/${{ github.repository }}/tree/${{ inputs.branch || github.ref_name }}
  USE_PRODUCTION_ROHUB: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.use_production_rohub) || 'true' }}

jobs:
  prepare-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install semantic-benchmark
        run: python -m pip install semantic-benchmark

      - name: Select RoHub credentials
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Download benchmark resources from RoHub
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/downloaded-benchmark"
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          python provenance/download_benchmark.py \
            --identifier "${BENCHMARK_ROHUB_IDENTIFIER}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --zip-resource-filename "${GITHUB_WORKSPACE}/${BENCHMARK_ZIP}" \
            --semantic-resource-filename "${GITHUB_WORKSPACE}/${BENCHMARK_FILE}" \
            "${rohub_args[@]}"

      - name: Archive downloaded benchmark resources
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: downloaded-benchmark/

  run-fenics:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-fenics.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_zip: downloaded-benchmark/linear-elastic-plate-with-hole.zip
      benchmark_artifact_name: downloaded-benchmark-resources

  run-kratos:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-kratos.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_zip: downloaded-benchmark/linear-elastic-plate-with-hole.zip
      benchmark_artifact_name: downloaded-benchmark-resources

  run-extendablefem:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-exfem.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_zip: downloaded-benchmark/linear-elastic-plate-with-hole.zip
      benchmark_artifact_name: downloaded-benchmark-resources

  upload-rocrates:
    runs-on: ubuntu-latest
    needs:
      - run-fenics
      - run-kratos
      - run-extendablefem
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - tool: fenics
            display_name: Fenics
            used_software_url: https://zbmath.org/software/4314
          - tool: kratos
            display_name: Kratos
            used_software_url: https://zbmath.org/software/7804
          - tool: extendablefem
            display_name: ExtendableFEM
            used_software_url: https://zbmath.org/software/53664

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Download ${{ matrix.display_name }} aggregate RO-Crate artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.tool }}-aggregate-rocrate
          path: artifacts/${{ matrix.tool }}

      - name: Setup Mambaforge with provenance env
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: provenance
          use-mamba: true
          environment-file: provenance/environment_provenance.yml
          conda-remove-defaults: "true"

      - name: Install semantic-benchmark
        shell: bash -l {0}
        run: python -m pip install semantic-benchmark

      - name: Select RoHub credentials
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Upload ${{ matrix.display_name }} RO-Crate Zip file onto RoHub
        shell: bash -l {0}
        env:
          TOOL: ${{ matrix.tool }}
          TOOL_DISPLAY_NAME: ${{ matrix.display_name }}
          USED_SOFTWARE_URL: ${{ matrix.used_software_url }}
        run: |
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          python provenance/upload_provenance.py \
            --provenance_folderpath "${GITHUB_WORKSPACE}/artifacts/${TOOL}/${TOOL}_rocrate.zip" \
            --benchmark-name "${BENCHMARK_NAME}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            --used-software-url "${USED_SOFTWARE_URL}" \
            "${rohub_args[@]}"

  wait-for-rohub-processing:
    runs-on: ubuntu-latest
    needs: upload-rocrates
    steps:
      - name: Wait for RoHub processing
        run: sleep 600

  process-artifacts:
    runs-on: ubuntu-latest
    needs: wait-for-rohub-processing
    env:
      USE_PRODUCTION_ROHUB: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.use_production_rohub) || 'true' }}

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Setup Mambaforge with provenance env
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: provenance
          use-mamba: true
          environment-file: provenance/environment_provenance.yml
          conda-remove-defaults: "true"

      - name: Install semantic-benchmark
        shell: bash -l {0}
        run: python -m pip install semantic-benchmark

      - name: Run Fenics plotting script
        shell: bash -l {0}
        run: |
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          python provenance/plot_plate_with_hole_metrics.py \
            --tool "fenics" \
            --output-file "fenics-element-size-vs-stress-plot.pdf" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            "${rohub_args[@]}"

      - name: Upload Fenics plot artifact
        uses: actions/upload-artifact@v7
        with:
          name: fenics-plot
          path: fenics-element-size-vs-stress-plot.pdf
          if-no-files-found: ignore

      - name: Run Kratos plotting script
        shell: bash -l {0}
        run: |
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          python provenance/plot_plate_with_hole_metrics.py \
            --tool "kratos" \
            --output-file "kratos-element-size-vs-stress-plot.pdf" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            "${rohub_args[@]}"

      - name: Upload Kratos plot artifact
        uses: actions/upload-artifact@v7
        with:
          name: kratos-plot
          path: kratos-element-size-vs-stress-plot.pdf
          if-no-files-found: ignore

      - name: Run ExtendableFEM plotting script
        shell: bash -l {0}
        run: |
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          python provenance/plot_plate_with_hole_metrics.py \
            --tool "extendablefem" \
            --output-file "extendablefem-element-size-vs-stress-plot.pdf" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            "${rohub_args[@]}"

      - name: Upload ExtendableFEM plot artifact
        uses: actions/upload-artifact@v7
        with:
          name: extendablefem-plot
          path: extendablefem-element-size-vs-stress-plot.pdf
          if-no-files-found: ignore
