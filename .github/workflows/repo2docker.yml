name: repo2docker

on:
  push:

env:
  IMAGE_NAME: ghcr.io/simulation-benchmarks/linear-elastic-plate-with-hole

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repo2docker
        run: pip install jupyter-repo2docker

      - name: Build the repository image (runs postBuild)
        run: |
          repo2docker --no-run \
            --image-name linear-elastic-plate-with-hole:ci \
            .

      - name: Verify postBuild produced the combined notebook
        run: |
          docker run --rm linear-elastic-plate-with-hole:ci \
            test -f notebooks/benchmark-results.ipynb

      # Only push on main and tags, not on every branch/PR push, to avoid
      # piling up images in the registry.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker tag linear-elastic-plate-with-hole:ci "$IMAGE_NAME:$SHA_TAG"
          docker push "$IMAGE_NAME:$SHA_TAG"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${{ github.ref_name }}"
          else
            REF_TAG="latest"
          fi
          docker tag linear-elastic-plate-with-hole:ci "$IMAGE_NAME:$REF_TAG"
          docker push "$IMAGE_NAME:$REF_TAG"
