name: Fenics CI
on:
  push:

  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to checkout for the benchmark run
        required: false
        type: string
      benchmark_file:
        description: Path to the semantic benchmark JSON-LD file
        required: false
        type: string
      benchmark_artifact_name:
        description: Optional artifact containing the benchmark files
        required: false
        type: string
        default: ''

env:
  ROCRATE_AGENT_NAME: Mahdi Jafarkhani
  ROCRATE_AGENT_ORCID: https://orcid.org/0009-0008-6162-8404
  BENCHMARK_NAME: linear-elastic-plate-with-hole
  BENCHMARK_VERSION: 1.1.0
  EXAMPLE_BENCHMARK_FILE: ${{ inputs.benchmark_file || 'benchmark/1.1.0/minimal-configurations.json' }}
  BRANCH_NAME: ${{ inputs.checkout_ref || github.head_ref || github.ref_name }}
  SOFTWARE_NAME: fenics
  ROCRATE_LICENSE: https://opensource.org/licenses/MIT
  ROCRATE_NAME: linear-elastic-plate-with-hole provenance (FEniCS)
  ROCRATE_DESCRIPTION_BASE: Provenance run of the benchmark for linear-elastic plate with a hole using FEniCS

jobs:
  run-examples:
    name: Fenics
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v4
        with:
            miniforge-version: latest
            use-mamba: true
            conda-remove-defaults: "true"
        
      - name: Create ${{ env.SOFTWARE_NAME }} environment
        run: mamba env create -n "${SOFTWARE_NAME}" -f "${SOFTWARE_NAME}/environment_benchmark.yml"

      - name: Install provenance Python packages
        shell: bash -l {0}
        run: |
          python -m pip install -r requirements.txt

      - name: Download benchmark resources artifact
        if: inputs.benchmark_artifact_name != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.benchmark_artifact_name }}
          path: downloaded-benchmark

      - name: Verify local benchmark resources
        shell: bash -l {0}
        run: |
          test -f "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}"

      - name: Run ${{ env.BENCHMARK_NAME }} using ${{ env.SOFTWARE_NAME }}
        shell: bash -l {0}
        env:
          UCX_TLS: tcp,sm,self
        run: |
          ROCRATE_DESCRIPTION="${ROCRATE_DESCRIPTION_BASE}, Version ${BENCHMARK_VERSION}, Branch ${BRANCH_NAME}"

          cd "$GITHUB_WORKSPACE/${SOFTWARE_NAME}/"
          conda run -n "${SOFTWARE_NAME}" python run_benchmark.py \
            --benchmark-file "${GITHUB_WORKSPACE}/${EXAMPLE_BENCHMARK_FILE}" \
            --rocrate-name "${RUNNER_TEMP}/${SOFTWARE_NAME}_rocrate.zip" \
            --result-path "${GITHUB_WORKSPACE}/${SOFTWARE_NAME}/results" \
            --crate-license "${ROCRATE_LICENSE}" \
            --crate-name "${ROCRATE_NAME}" \
            --crate-description "${ROCRATE_DESCRIPTION}" \
            --workflow-path "${GITHUB_WORKSPACE}/.github/workflows/run-benchmark-fenics.yml" \
            --agent-name "${ROCRATE_AGENT_NAME}" \
            --agent-orcid "${ROCRATE_AGENT_ORCID}"

      - name: Archive results of the ${{ env.SOFTWARE_NAME }} run of ${{ env.BENCHMARK_NAME }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}_results_${{ env.BENCHMARK_NAME }}
          path: |
            ${{ env.SOFTWARE_NAME }}/results/
            !${{ env.SOFTWARE_NAME }}/results/*/FEniCS-*.zip

      - name: Archive ${{ env.SOFTWARE_NAME }} aggregate RO-Crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SOFTWARE_NAME }}-aggregate-rocrate
          path: ${{ runner.temp }}/${{ env.SOFTWARE_NAME }}_rocrate.zip